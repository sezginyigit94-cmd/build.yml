      - name: APK derle
        working-directory: hattemiz
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK dosyasini goster
        run: find hattemiz/app/build/outputs -name "*.apk"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: hattemiz-apk
          path: hattemiz/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
